<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="384" viewBox="0 0 1200 384"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Mnemon — local-first memory for AI coding agents</title>
  <desc id="hero-desc">The Mnemon wordmark beside a stylized session-start context block showing project, branch, focus, decision, task, and graph knowledge that the agent receives at session start.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', 'Menlo', monospace; }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="384" rx="16" fill="#101418"/>

  <!-- title block -->
  <g transform="translate(64 0)">
    <text class="mono" x="0" y="88" font-size="17" letter-spacing="3.5" fill="#97A1AA">LOCAL-FIRST MEMORY FOR AI CODING AGENTS</text>

    <text class="sans" x="-4" y="178" font-size="84" font-weight="700" letter-spacing="-1" fill="#F2EFE8">Mnemon</text>
    <!-- terminal cursor cue -->
    <rect x="332" y="118" width="20" height="64" fill="#F0B429"/>

    <text class="sans" x="0" y="232" font-size="23" fill="#D9DEE4">Your agent starts every session already knowing</text>
    <text class="sans" x="0" y="264" font-size="23" fill="#D9DEE4">the branch, the decisions, and the open tasks.</text>

    <!-- metadata row -->
    <g class="mono" font-size="16">
      <text x="0" y="330" fill="#F0B429">mnemon serve</text>
      <text x="150" y="330" fill="#6B7681">&#183;</text>
      <text x="168" y="330" fill="#97A1AA">SQLite</text>
      <text x="248" y="330" fill="#6B7681">&#183;</text>
      <text x="266" y="330" fill="#97A1AA">MCP over stdio</text>
      <text x="404" y="330" fill="#6B7681">&#183;</text>
      <text x="422" y="330" fill="#97A1AA">owner/repo scoped</text>
    </g>
  </g>

  <!-- proof: the context block an agent receives at session start -->
  <g transform="translate(724 56)">
    <rect width="412" height="272" rx="10" fill="#1A2129" stroke="#2A333D" stroke-width="1.5"/>

    <!-- card header -->
    <text class="mono" x="28" y="42" font-size="16" font-weight="600" letter-spacing="1.5" fill="#F0B429">&#9670; SESSION START</text>
    <text class="mono" x="384" y="42" font-size="15" text-anchor="end" fill="#6B7681">memory_read()</text>
    <line x1="28" y1="58" x2="384" y2="58" stroke="#2A333D" stroke-width="1.5"/>

    <!-- context rows -->
    <g class="mono" font-size="16">
      <text x="28" y="92" fill="#6B7681">PROJECT</text>
      <text x="116" y="92" fill="#F2EFE8">paulushcgcj/mnemon</text>

      <text x="28" y="122" fill="#6B7681">BRANCH</text>
      <text x="116" y="122" fill="#F2EFE8">feature/csv-imports</text>

      <text x="28" y="152" fill="#6B7681">FOCUS</text>
      <text x="116" y="152" fill="#F2EFE8">finish CSV import tests</text>

      <text x="28" y="182" fill="#6B7681">DECISION</text>
      <text x="116" y="182" fill="#F2EFE8">prefer aiosqlite</text>

      <text x="28" y="212" fill="#6B7681">TASK</text>
      <text x="116" y="212" fill="#F2EFE8">malformed-row tests</text>
      <text x="300" y="212" fill="#F0B429">wip</text>

      <text x="28" y="242" fill="#6B7681">GRAPH</text>
      <text x="116" y="242" fill="#F2EFE8">ImportService &#8594; owns &#8594; CSV validation</text>
    </g>

    <!-- amber memory markers on agent-written rows -->
    <g fill="#F0B429">
      <rect x="14" y="142" width="6" height="6" transform="rotate(45 17 145)"/>
      <rect x="14" y="202" width="6" height="6" transform="rotate(45 17 207)"/>
      <rect x="14" y="232" width="6" height="6" transform="rotate(45 17 237)"/>
    </g>
  </g>
</svg>
